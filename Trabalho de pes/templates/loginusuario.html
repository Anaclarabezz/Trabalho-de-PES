<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hotel ByGirls</title>
    <link rel="stylesheet" href="/static/estilo.css">
</head>
<body>

    <div class="container">

        <h1>Hotel ByGirls</h1>
        <h2>Login</h2>

        <form action="/loginusuario" method="POST">

            <div class="form-row">
                <input
                    type="email"
                    name="email"
                    placeholder="E-mail"
                    required>
            </div>

            <div class="form-row">
                <input
                    type="password"
                    name="senha"
                    placeholder="Senha"
                    required>
            </div>

            <div class="button-container">
                <button type="submit">Entrar</button>
            </div>

            {% if mensagem_erro %}
                <div class="mensagem-erro">
                    {{ mensagem_erro }}
                </div>
            {% endif %}

            {% if mensagem_sucesso %}
                <div class="mensagem-sucesso">
                    {{ mensagem_sucesso }}
                </div>
            {% endif %}

            <div class="links-abaixo">
                <p>Ainda não possui uma conta?</p>
                <a href="/usuario" class="menu-button">
                 Criar Cadastro
                </a>
            </div>

            <div class="links-abaixo">
                <a href="/" class="menu-button">
                    Voltar ao Menu
                </a>
            </div>

        </form>

    </div>

</body>
</html>
